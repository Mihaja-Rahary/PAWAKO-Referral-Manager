<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/pawako-logo-square.jpg" />
    <title>PAWAKO Referral Manager</title>
    <meta name="description" content="Système centralisé de gestion des parrainages, du recrutement et du suivi des agents PAWAKO connecté à Discord." />
    <meta property="og:title" content="PAWAKO Referral Manager" />
    <meta property="og:description" content="Système centralisé de gestion des parrainages, du recrutement et du suivi des agents PAWAKO connecté à Discord." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://referral-manager.pawako-saas.workers.dev" crossorigin />
    <link rel="dns-prefetch" href="https://referral-manager.pawako-saas.workers.dev" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pawako_ui_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#06040a] dark:text-[#f4f1fa] antialiased selection:bg-violet-500/30 selection:text-violet-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
